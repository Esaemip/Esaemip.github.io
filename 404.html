    body::before { content:""; position:fixed; inset:-220px 0 0; pointer-events:none; opacity:.24; background-image:radial-gradient(circle,rgba(255,255,255,.98) 0 1.7px,transparent 2.3px),radial-gradient(circle,rgba(121,146,156,.28) 0 1px,transparent 1.5px); background-position:22px 18px,105px 87px; background-size:190px 220px,145px 175px; animation:snow 18s linear infinite; }
    a { color:inherit; text-decoration:none; }
    .site-nav { position:relative; z-index:2; display:flex; width:min(1040px,calc(100% - 48px)); height:80px; margin:auto; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(101,120,113,.12); }

    .brand svg { width:31px; height:31px; }
    .brand strong { font-size:20px; font-weight:900; letter-spacing:-.05em; }
    .brand span { color:#87918c; font-size:10px; font-weight:700; }
    .nav-links { display:flex; gap:27px; color:#56625c; font-size:13px; font-weight:750; }
    .error-main { position:relative; z-index:1; display:flex; width:min(720px,calc(100% - 48px)); min-height:calc(100vh - 80px); margin:auto; padding:80px 0 130px; align-items:center; justify-content:center; flex-direction:column; text-align:center; }
    .error-main svg { width:70px; height:70px; margin-bottom:17px; transform:rotate(-6deg); }
    .error-main>p { margin:0; color:var(--warm); font:800 11px Consolas,monospace; }
    h1 { margin:13px 0 0; font-size:clamp(38px,6vw,58px); letter-spacing:-.06em; }
    .error-main>span { margin-top:17px; color:var(--muted); font-size:14px; }
    .error-main>a { margin-top:28px; padding-bottom:2px; border-bottom:1px solid #a9b7b1; color:var(--green); font-size:12px; font-weight:850; }
    @keyframes snow { from{transform:translate3d(-7px,0,0)} to{transform:translate3d(17px,270px,0)} }
    @media(max-width:600px){ .site-nav{width:calc(100% - 32px);height:66px}.brand span,.nav-links a:first-child{display:none}.nav-links{gap:15px;font-size:11px}.error-main{width:calc(100% - 32px);min-height:calc(100vh - 66px);padding-bottom:100px}h1{font-size:39px} }
    @media(prefers-reduced-motion:reduce){ body::before{animation:none} }
